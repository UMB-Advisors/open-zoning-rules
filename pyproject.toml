[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-zoning-rules"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline/ozr"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
